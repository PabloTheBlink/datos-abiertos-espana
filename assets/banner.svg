<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D0A" />
      <stop offset="50%" stop-color="#0B0A08" />
      <stop offset="100%" stop-color="#14120F" />
    </linearGradient>
    <radialGradient id="glowGold" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FFB340" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0A08" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7697FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B0A08" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD175" />
      <stop offset="100%" stop-color="#FF9B54" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D1A16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14120F" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'ui-monospace', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .sans { font-family: 'Bricolage Grotesque', 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.04em; }
    .subtitle { font-weight: 400; letter-spacing: -0.01em; }
    .badge { font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; }
    .stat-val { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
    .stat-lbl { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#glowGold)" />
  <rect width="1200" height="380" fill="url(#glowBlue)" />

  <!-- Outer frame -->
  <rect x="1" y="1" width="1198" height="378" fill="none" stroke="rgba(243, 237, 226, 0.12)" stroke-width="1.5" rx="8" />

  <!-- Grid decoration lines -->
  <line x1="60" y1="0" x2="60" y2="380" stroke="rgba(243, 237, 226, 0.04)" stroke-width="1" />
  <line x1="1140" y1="0" x2="1140" y2="380" stroke="rgba(243, 237, 226, 0.04)" stroke-width="1" />
  <line x1="0" y1="84" x2="1200" y2="84" stroke="rgba(243, 237, 226, 0.05)" stroke-width="1" />
  <line x1="0" y1="265" x2="1200" y2="265" stroke="rgba(243, 237, 226, 0.06)" stroke-width="1" />

  <!-- Top eyebrow pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1C1915" stroke="rgba(243, 237, 226, 0.16)" />
    <circle cx="14" cy="13" r="4" fill="#FFB340" />
    <text x="26" y="17" fill="#B6AB9B" class="mono badge">● DEVETTY OPEN DATA · ESPAÑA</text>
  </g>

  <!-- Top right live tag -->
  <g transform="translate(930, 42)">
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#15211B" stroke="rgba(164, 221, 121, 0.3)" />
    <circle cx="14" cy="13" r="4" fill="#A4DD79" />
    <text x="26" y="17" fill="#A4DD79" class="mono badge">ACTUALIZACIÓN DIARIA</text>
  </g>

  <!-- Title -->
  <text x="60" y="152" fill="#F3EDE2" class="sans title" font-size="52">
    DATOS ABIERTOS DE <tspan fill="url(#textGrad)">ESPAÑA</tspan>
  </text>

  <!-- Subtitle -->
  <text x="60" y="196" fill="#B6AB9B" class="sans subtitle" font-size="20">
    Compilación limpia en CSV y JSON de fuentes oficiales · 100% libre sin API keys ni registro
  </text>
  <text x="60" y="228" fill="#7E7569" class="mono" font-size="13">
    MITECO · Boletín Oficial del Estado (BOE) · Base de Datos Nacional de Subvenciones (BDNS)
  </text>

  <!-- Bottom cards -->
  <!-- Card 1: Gasolineras -->
  <g transform="translate(60, 280)">
    <rect width="250" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(94, 223, 209, 0.3)" />
    <line x1="0" y1="0" x2="4" y2="74" stroke="#5EDFD1" stroke-width="4" />
    <text x="20" y="32" fill="#5EDFD1" class="mono stat-lbl">⛽ 11.577 ESTACIONES</text>
    <text x="20" y="58" fill="#F3EDE2" class="sans stat-val">Gasolineras MITECO</text>
  </g>

  <!-- Card 2: Subastas -->
  <g transform="translate(330, 280)">
    <rect width="250" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 170, 115, 0.3)" />
    <line x1="0" y1="0" x2="4" y2="74" stroke="#FFAA73" stroke-width="4" />
    <text x="20" y="32" fill="#FFAA73" class="mono stat-lbl">🏛️ 1.003 LOTES ACTIVOS</text>
    <text x="20" y="58" fill="#F3EDE2" class="sans stat-val">Subastas del BOE</text>
  </g>

  <!-- Card 3: Subvenciones -->
  <g transform="translate(600, 280)">
    <rect width="250" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(164, 221, 121, 0.3)" />
    <line x1="0" y1="0" x2="4" y2="74" stroke="#A4DD79" stroke-width="4" />
    <text x="20" y="32" fill="#A4DD79" class="mono stat-lbl">💶 1.567 CONVOCATORIAS</text>
    <text x="20" y="58" fill="#F3EDE2" class="sans stat-val">Ayudas BDNS</text>
  </g>

  <!-- Card 4: Oposiciones -->
  <g transform="translate(870, 280)">
    <rect width="270" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(198, 235, 82, 0.3)" />
    <line x1="0" y1="0" x2="4" y2="74" stroke="#C6EB52" stroke-width="4" />
    <text x="20" y="32" fill="#C6EB52" class="mono stat-lbl">📋 523 PROCESOS</text>
    <text x="20" y="58" fill="#F3EDE2" class="sans stat-val">Empleo Público BOE</text>
  </g>
</svg>
